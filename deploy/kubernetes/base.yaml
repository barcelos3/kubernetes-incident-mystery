apiVersion: v1
kind: Namespace
metadata:
  name: kubernetes-mystery
  labels:
    app.kubernetes.io/name: kubernetes-incident-mystery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-incident-mystery
  namespace: kubernetes-mystery
  labels:
    app.kubernetes.io/name: kubernetes-incident-mystery
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-incident-mystery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-incident-mystery
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/SEU_USUARIO/kubernetes-incident-mystery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-incident-mystery
  namespace: kubernetes-mystery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kubernetes-incident-mystery
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubernetes-incident-mystery
  namespace: kubernetes-mystery
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-incident-mystery
