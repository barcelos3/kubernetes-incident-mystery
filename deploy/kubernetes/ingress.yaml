apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kubernetes-incident-mystery
  namespace: kubernetes-mystery
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s-mystery.example.com
      secretName: kubernetes-mystery-tls
  rules:
    - host: k8s-mystery.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kubernetes-incident-mystery
                port:
                  number: 80
